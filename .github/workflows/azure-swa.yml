# ============================================================
#  .github/workflows/azure-swa.yml
#
#  CI/CD pipeline for the Restaurant Reviews app.
#  Deploys the API to Azure Function App and the React frontend
#  to an Azure Storage Static Website.
#
#  Required GitHub secrets
#  ───────────────────────
#  AZURE_FUNCTION_APP_NAME
#    Name of the Azure Function App provisioned by infra/main.bicep.
#
#  AZURE_FUNCTIONAPP_PUBLISH_PROFILE
#    Publish profile XML for the Function App.
#    Get it with:
#      az functionapp deployment list-publishing-profiles \
#        --name <your-function-app-name> \
#        --resource-group <your-resource-group> \
#        --xml
#
#  AZURE_STORAGE_CONNECTION_STRING
#    Connection string for the Storage Account that hosts the static website.
#    Get it with:
#      az storage account show-connection-string \
#        --name <your-storage-account-name> \
#        --resource-group <your-resource-group> \
#        --query connectionString -o tsv
#
#  Optional GitHub secret
#  ──────────────────────
#  VITE_APPLICATIONINSIGHTS_CONNECTION_STRING
#    Application Insights connection string baked into the frontend
#    bundle at build time. Leave blank to disable frontend telemetry.
# ============================================================

name: Azure Storage Website + Function App CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build_validation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Build Validation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            api/package-lock.json

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.VITE_APPLICATIONINSIGHTS_CONNECTION_STRING }}

      - name: Install and build API
        working-directory: api
        run: |
          npm ci
          npm run build

  build_and_deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Build and Deploy Production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            api/package-lock.json

      - name: Install and build API
        working-directory: api
        run: |
          npm ci
          npm run build

      - name: Deploy API to Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.AZURE_FUNCTION_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          package: ./api
          respect-funcignore: true

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_BASE_URL: https://${{ secrets.AZURE_FUNCTION_APP_NAME }}.azurewebsites.net/api
          VITE_APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.VITE_APPLICATIONINSIGHTS_CONNECTION_STRING }}

      - name: Upload frontend to Storage Static Website
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        run: |
          az storage blob upload-batch \
            --connection-string "$AZURE_STORAGE_CONNECTION_STRING" \
            --destination '$web' \
            --source frontend/dist \
            --overwrite
